{% extends "registrations/base.html" %}
{% block title %}New Session | CDC Registration{% endblock %}
{% block content %}
<section class="card">
  <h1>New session required</h1>
  <p class="muted">No open sessions are available. Create the next session to continue registering participants.</p>
  <form method="post" class="form-grid">
    {% csrf_token %}
    <input type="hidden" name="next_url" value="{{ next_url }}">
    <label class="field">
      <span>Session label</span>
      {{ form.label }}
    </label>
    <label class="field">
      <span>Start time</span>
      {{ form.start_time }}
    </label>
    <div class="button-row">
      <button class="button button-filled" type="submit">Create session</button>
      <a class="button button-outlined" href="{{ next_url }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
